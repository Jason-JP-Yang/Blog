<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f2-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f2328" d="m0 0 10 5-10 5z"/></marker><marker id="f2-pur" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c5cd6" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:16px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.iso,.iso2{fill:none;stroke:#9fbdea;stroke-width:1.4}.iso2{stroke:#cfd8e3;stroke-width:1.2;stroke-dasharray:4 4}.edge{fill:#eaf1fb;stroke:#2f6fd0;stroke-width:2.2}.ax{stroke:#9aa2ad;stroke-width:1.4}</style></defs><path fill="#fbfcfd" d="M0 0h920v560H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">深度斜坡：用内切圆半径替换 <tspan class="mono" font-size="19">length(st)</tspan></text><text x="24" y="58" style="font-size:14px;fill:#6b7280">对圆而言 <tspan class="mono">length(st) = sd + R</tspan>；把 R 换成任意形状的内切圆半径 r，斜坡对所有形状都成立</text><rect width="420" height="330" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="106" class="cap">圆 · <tspan class="mono" font-size="15">length(st) = sd + R</tspan></text><circle cx="234" cy="256" r="140" class="iso2"/><circle cx="234" cy="256" r="30" class="iso"/><circle cx="234" cy="256" r="60" class="iso"/><circle cx="234" cy="256" r="90" class="iso"/><circle cx="234" cy="256" r="110" fill="none" class="edge"/><circle cx="234" cy="256" r="110" fill="#2f6fd0" opacity=".06"/><circle cx="234" cy="256" r="3.5" fill="#1f2328"/><path marker-end="url(#f2-ink)" d="M234 256h110" class="ax"/><text x="262" y="248" class="lbl"><tspan class="mono">length(st)</tspan></text><text x="340" y="290" class="lbl">R</text><text x="44" y="384" class="lbl">距离中心的长度，恰好也是「离边界有多深」——这是巧合，不是定义。</text><rect width="420" height="330" x="476" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="496" y="106" class="cap">方 · <tspan class="mono" font-size="15">w = clamp(sd + r, 0, r)</tspan></text><rect width="260" height="260" x="566" y="126" class="iso2" rx="30"/><path fill="none" d="M586 146h220v220H586z" class="edge"/><path fill="#2f6fd0" d="M586 146h220v220H586z" opacity=".06"/><path d="M616 176h160v160H616z" class="iso"/><path d="M646 206h100v100H646z" class="iso"/><path d="M676 236h40v40h-40z" class="iso"/><circle cx="696" cy="256" r="110" style="fill:none;stroke:#7c5cd6;stroke-width:2;stroke-dasharray:7 5"/><circle cx="696" cy="256" r="3.5" fill="#1f2328"/><path stroke="#7c5cd6" marker-end="url(#f2-pur)" d="M696 256h110" class="ax"/><text x="716" y="248" fill="#7c5cd6" class="lbl">r = 内切圆半径</text><text x="496" y="384" class="lbl">等距线是同心方框；<tspan class="mono">length(st)</tspan> 与「深度」再无关系，必须改用 <tspan class="mono">sd + r</tspan>。</text><rect width="872" height="118" x="24" y="422" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="450" class="cap">深度权重 w 随 sd 的变化</text><path marker-end="url(#f2-ink)" d="M330 522h470" class="ax"/><path marker-end="url(#f2-ink)" d="M360 530v-68" class="ax"/><path d="M340 522h140l160-52h140" style="fill:none;stroke:#2f9e6b;stroke-width:3;stroke-linejoin:round"/><circle cx="480" cy="522" r="4" fill="#2f9e6b"/><circle cx="640" cy="470" r="4" fill="#2f9e6b"/><text x="452" y="540" class="lbl">sd = −r</text><text x="622" y="540" class="lbl">sd = 0（边界）</text><text x="308" y="468" class="lbl">w</text><text x="660" y="464" class="lbl">w = r</text><text x="44" y="480" class="lbl">中心处 w = 0（不折射），</text><text x="44" y="500" class="lbl">到边界线性升到 r，</text><text x="44" y="520" class="lbl">对圆化简后与参考实现逐比特一致。</text></svg>