<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f2-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f2328" d="m0 0 10 5-10 5z"/></marker><marker id="f2-pur" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c5cd6" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:15px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.iso,.iso2{fill:none;stroke:#9fbdea;stroke-width:1.3}.iso2{stroke:#cfd8e3;stroke-width:1.2;stroke-dasharray:4 4}.edge{fill:none;stroke:#2f6fd0;stroke-width:2.2}.ax{stroke:#9aa2ad;stroke-width:1.4}</style></defs><path fill="#fbfcfd" d="M0 0h920v520H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">深度权重的构造</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">参考实现以到形状中心的距离作为深度，该等式仅对圆成立；一般形式由内切圆半径给出</text><rect width="420" height="300" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="106" class="cap">圆：<tspan class="mono" font-size="14">length(st) = sd + R</tspan></text><circle cx="234" cy="240" r="108" class="iso2"/><circle cx="234" cy="240" r="22" class="iso"/><circle cx="234" cy="240" r="45" class="iso"/><circle cx="234" cy="240" r="67" class="iso"/><circle cx="234" cy="240" r="90" fill="#2f6fd0" fill-opacity=".06"/><circle cx="234" cy="240" r="90" class="edge"/><circle cx="234" cy="240" r="3.5" fill="#1f2328"/><path marker-end="url(#f2-ink)" d="M234 240h90" class="ax"/><text x="248" y="232" fill="#6b7280" class="mono">length(st)</text><text x="316" y="262" class="lbl">R</text><text x="44" y="366" class="lbl">径向长度同时也是深度，属于圆的巧合</text><rect width="420" height="300" x="476" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="496" y="106" class="cap">方：<tspan class="mono" font-size="14">w = clamp(sd + r, 0, r)</tspan></text><rect width="216" height="216" x="578" y="132" class="iso2" rx="18"/><path fill="#2f6fd0" fill-opacity=".06" d="M596 150h180v180H596z"/><path d="M596 150h180v180H596z" class="edge"/><path d="M619 173h134v134H619z" class="iso"/><path d="M641 195h90v90h-90z" class="iso"/><path d="M664 218h44v44h-44z" class="iso"/><circle cx="686" cy="240" r="90" style="fill:none;stroke:#7c5cd6;stroke-width:1.8;stroke-dasharray:7 5"/><circle cx="686" cy="240" r="3.5" fill="#1f2328"/><path stroke="#7c5cd6" marker-end="url(#f2-pur)" d="M686 240h90" class="ax"/><text x="700" y="232" fill="#7c5cd6" class="lbl">r（内切圆半径）</text><text x="496" y="366" class="lbl">等距线为同心方框，深度须由 <tspan class="mono">sd + r</tspan> 给出</text><rect width="872" height="96" x="24" y="404" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="432" class="cap">深度权重随有向距离的变化</text><text x="44" y="462" fill="#6b7280" class="mono">w = clamp(sd + r, 0, r)</text><path marker-end="url(#f2-ink)" d="M300 474h456" class="ax"/><path marker-end="url(#f2-ink)" d="M300 484v-60" class="ax"/><path d="M316 474h84l160-38h140" style="fill:none;stroke:#2f9e6b;stroke-width:3;stroke-linejoin:round"/><circle cx="400" cy="474" r="4" fill="#2f9e6b"/><circle cx="560" cy="436" r="4" fill="#2f9e6b"/><text x="372" y="492" fill="#6b7280" class="mono">sd = −r</text><text x="534" y="492" fill="#6b7280" class="mono">sd = 0</text><text x="712" y="440" fill="#6b7280" class="mono">w = r</text><text x="284" y="428" fill="#6b7280" class="mono">w</text><text x="766" y="478" fill="#6b7280" class="mono">sd</text></svg>