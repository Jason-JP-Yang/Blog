<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f7-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f2328" d="m0 0 10 5-10 5z"/></marker><marker id="f7-grn" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2f9e6b" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:16px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.row{fill:#cdd7e3}</style></defs><path fill="#fbfcfd" d="M0 0h920v520H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">Page 模式：一次截整篇文档，滚动只滑动 <tspan class="mono" font-size="19">uTexTransform</tspan></text><text x="24" y="58" style="font-size:14px;fill:#6b7280">若只截视口，每次滚动都要重新 html2canvas；截整篇之后，滚动的成本降到 4 个 float</text><rect width="300" height="392" x="24" y="80" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="110" class="cap">全文档快照（H = docHeight）</text><path d="M94 126h160v320H94z" style="fill:#eef2f7;stroke:#c3cbd5;stroke-width:1.6"/><g class="row"><rect width="136" height="10" x="106" y="138" rx="3"/><rect width="100" height="7" x="106" y="156" rx="3"/><rect width="120" height="7" x="106" y="170" rx="3"/><rect width="136" height="46" x="106" y="190" fill="#b6c4d4" rx="4"/><rect width="112" height="7" x="106" y="246" rx="3"/><rect width="130" height="7" x="106" y="260" rx="3"/><rect width="90" height="7" x="106" y="274" rx="3"/><rect width="136" height="34" x="106" y="296" fill="#b6c4d4" rx="4"/><rect width="122" height="7" x="106" y="340" rx="3"/><rect width="136" height="7" x="106" y="354" rx="3"/><rect width="80" height="7" x="106" y="368" rx="3"/><rect width="136" height="42" x="106" y="388" fill="#b6c4d4" rx="4"/></g><path d="M88 150h172v92H88z" style="fill:none;stroke:#2f9e6b;stroke-width:2;stroke-dasharray:6 4;opacity:.55"/><path d="M88 272h172v92H88z" style="fill:none;stroke:#2f9e6b;stroke-width:2.6"/><path stroke="#2f9e6b" stroke-width="2" marker-end="url(#f7-grn)" d="M174 248v18"/><text x="264" y="200" fill="#2f9e6b" class="lbl">scrollY = 0</text><text x="264" y="322" fill="#2f9e6b" class="lbl">滚动后</text><rect width="248" height="392" x="348" y="80" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="368" y="110" class="cap">每帧只更新 4 个 float</text><rect width="208" height="128" x="368" y="132" fill="#f4f7fb" stroke="#dfe3e8" rx="10"/><text x="384" y="158" class="mono">out.x = 1</text><text x="384" y="180" class="mono">out.y = vh / H</text><text x="384" y="202" class="mono">out.z = 0</text><text x="384" y="224" class="mono">out.w = 1 − (scrollY+vh)/H</text><text x="384" y="248" class="lbl">（纹理是 y-flip 上传的）</text><text x="368" y="288" fill="#2f6fd0" class="mono">uv * uTexTransform.xy</text><text x="368" y="308" fill="#2f6fd0" class="mono">   + uTexTransform.zw</text><text x="368" y="346" class="lbl">滚动 = 不重截、不重传、</text><text x="368" y="366" class="lbl">不重建 mip 链。</text><text x="368" y="392" class="lbl">代价：任何 DOM 变化</text><text x="368" y="412" class="lbl">（hover / 懒加载 / 换主题 /</text><text x="368" y="432" class="lbl">CSS 动画）都会让整张</text><text x="368" y="452" class="lbl">快照失效。</text><path stroke="#1f2328" stroke-width="2" marker-end="url(#f7-ink)" d="M600 276h32"/><path stroke="#1f2328" stroke-width="2" marker-end="url(#f7-ink)" d="M330 276h14"/><rect width="256" height="392" x="640" y="80" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="660" y="110" class="cap">视口合成结果</text><rect width="216" height="300" x="660" y="132" fill="#eef2f7" stroke="#c3cbd5" rx="8"/><g class="row"><rect width="184" height="10" x="676" y="150" rx="3"/><rect width="150" height="7" x="676" y="170" rx="3"/><rect width="170" height="7" x="676" y="186" rx="3"/><rect width="150" height="7" x="676" y="330" rx="3"/><rect width="184" height="7" x="676" y="346" rx="3"/><rect width="120" height="7" x="676" y="362" rx="3"/></g><rect width="156" height="96" x="690" y="214" fill="#2f6fd0" fill-opacity=".12" stroke="#2f6fd0" stroke-opacity=".7" stroke-width="2" rx="26"/><text x="716" y="268" fill="#2f6fd0" class="lbl">玻璃（透明合成）</text><text x="660" y="456" class="lbl">玻璃外的 DOM 文字完全没被碰过，依旧是原生清晰度。</text><text x="24" y="500" class="lbl">canvas 以 <tspan class="mono">position:fixed; inset:0; pointer-events:none</tspan> 盖在页面上，<tspan class="mono">uOpaqueBg = 0</tspan> 时只有玻璃与投影区域写入 alpha。</text></svg>