<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f7-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#8b949e" d="m0 0 10 5-10 5z"/></marker><marker id="f7-grn" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2f9e6b" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:15px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.row{fill:#ccd6e2}.ar{stroke:#8b949e;stroke-width:1.6;fill:none}</style></defs><path fill="#fbfcfd" d="M0 0h920v520H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">Page 模式的纹理映射</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">快照覆盖整篇文档；滚动仅改变纹理变换的平移分量，不触发重新截图</text><rect width="290" height="390" x="24" y="80" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="110" class="cap">全文档快照（高度 H）</text><path d="M104 140h160v290H104z" style="fill:#eef2f7;stroke:#c3cbd5;stroke-width:1.5"/><g class="row"><rect width="136" height="10" x="116" y="152" rx="3"/><rect width="102" height="7" x="116" y="170" rx="3"/><rect width="122" height="7" x="116" y="184" rx="3"/><rect width="136" height="44" x="116" y="204" fill="#b6c4d4" rx="4"/><rect width="112" height="7" x="116" y="258" rx="3"/><rect width="130" height="7" x="116" y="272" rx="3"/><rect width="88" height="7" x="116" y="286" rx="3"/><rect width="136" height="34" x="116" y="306" fill="#b6c4d4" rx="4"/><rect width="122" height="7" x="116" y="350" rx="3"/><rect width="136" height="7" x="116" y="364" rx="3"/><rect width="80" height="7" x="116" y="378" rx="3"/><rect width="136" height="26" x="116" y="396" fill="#b6c4d4" rx="4"/></g><path d="M98 160h172v84H98z" style="fill:none;stroke:#2f9e6b;stroke-width:2;stroke-dasharray:6 4;opacity:.5"/><circle cx="112" cy="174" r="10" fill="#2f9e6b" opacity=".5"/><text x="112" y="179" fill="#fff" font-size="12" text-anchor="middle">1</text><path d="M98 300h172v84H98z" style="fill:none;stroke:#2f9e6b;stroke-width:2.4"/><circle cx="112" cy="314" r="10" fill="#2f9e6b"/><text x="112" y="319" fill="#fff" font-size="12" text-anchor="middle">2</text><path stroke="#2f9e6b" stroke-width="2" marker-end="url(#f7-grn)" d="M184 250v44"/><text x="44" y="452" class="lbl">1 初始视口　2 滚动后的视口</text><rect width="270" height="390" x="330" y="80" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="350" y="110" class="cap">每帧更新 4 个 float</text><rect width="230" height="120" x="350" y="130" fill="#f4f7fb" stroke="#dfe3e8" rx="10"/><text x="364" y="156" fill="#1f2328" class="mono">out.x = 1</text><text x="364" y="178" fill="#1f2328" class="mono">out.y = vh / H</text><text x="364" y="200" fill="#1f2328" class="mono">out.z = 0</text><text x="364" y="222" fill="#1f2328" class="mono">out.w = 1 − (scrollY+vh)/H</text><text x="350" y="274" class="lbl">纹理按 y 轴翻转上传，故第四项取补</text><text x="350" y="316" class="cap">着色器中的采样</text><text x="350" y="342" fill="#2f6fd0" class="mono">uv * uTexTransform.xy</text><text x="350" y="362" fill="#2f6fd0" class="mono">   + uTexTransform.zw</text><text x="350" y="404" class="lbl">滚动不触发重新截图、</text><text x="350" y="426" class="lbl">重新上传与 mip 重建</text><text x="350" y="452" class="lbl">但任何 DOM 变化都会使快照失效</text><path marker-end="url(#f7-ink)" d="M314 270h12" class="ar"/><path marker-end="url(#f7-ink)" d="M600 270h12" class="ar"/><rect width="280" height="390" x="616" y="80" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="636" y="110" class="cap">视口合成结果</text><rect width="240" height="300" x="636" y="132" fill="#eef2f7" stroke="#c3cbd5" rx="8"/><g class="row"><rect width="204" height="10" x="654" y="152" rx="3"/><rect width="168" height="7" x="654" y="172" rx="3"/><rect width="188" height="7" x="654" y="188" rx="3"/><rect width="168" height="7" x="654" y="336" rx="3"/><rect width="204" height="7" x="654" y="352" rx="3"/><rect width="132" height="7" x="654" y="368" rx="3"/></g><rect width="184" height="92" x="664" y="216" fill="#2f6fd0" fill-opacity=".12" stroke="#2f6fd0" stroke-opacity=".7" stroke-width="2" rx="30"/><text x="756" y="267" fill="#2f6fd0" class="lbl" text-anchor="middle">玻璃（透明合成）</text><text x="636" y="452" class="lbl">玻璃外的 DOM 保持原生清晰度</text><text x="24" y="500" class="lbl">画布以 <tspan class="mono">position:fixed; inset:0; pointer-events:none</tspan> 覆盖页面，<tspan class="mono">uOpaqueBg = 0</tspan> 时仅玻璃与投影区域写入 alpha</text></svg>