<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f3-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2f6fd0" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:16px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.edge,.n{fill:#eaf1fb;stroke:#2f6fd0;stroke-width:2.2}.n{fill:none;stroke-width:2.4}.hot{fill:#d94f4f;opacity:.1}</style></defs><path fill="#fbfcfd" d="M0 0h920v500H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">中轴（medial axis）：法线翻转留下的那道缝</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">最近边界点发生切换的地方，精确法线本来就是不连续的——这不是 bug，真实玻璃块也是这样</text><rect width="420" height="360" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="106" class="cap">尖角正方形 · 缝一直延伸到角点</text><path d="M124 156h220v220H124z" class="edge"/><circle cx="124" cy="156" r="30" class="hot"/><circle cx="344" cy="156" r="30" class="hot"/><circle cx="124" cy="376" r="30" class="hot"/><circle cx="344" cy="376" r="30" class="hot"/><path marker-end="url(#f3-blue)" d="M234 216v-40" class="n"/><path marker-end="url(#f3-blue)" d="M294 266h40" class="n"/><text x="244" y="196" class="lbl">↑ 上边</text><text x="272" y="292" class="lbl">右边 →</text><text x="150" y="330" fill="#d94f4f" class="lbl">跨过对角线，法线整整翻转 90°</text><text x="44" y="412" class="lbl">红色高亮处折射最强（<tspan class="mono">∝ 1/|sd|</tspan>），缝正好落在那里，所以最扎眼。</text><rect width="420" height="360" x="476" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="496" y="106" class="cap">圆角 &gt; 0 · 缝向内退，边缘干净</text><rect width="220" height="220" x="576" y="156" class="edge" rx="52"/><circle cx="628" cy="208" r="3.6" fill="#d94f4f"/><circle cx="744" cy="208" r="3.6" fill="#d94f4f"/><circle cx="628" cy="324" r="3.6" fill="#d94f4f"/><circle cx="744" cy="324" r="3.6" fill="#d94f4f"/><circle cx="686" cy="266" r="3.6" fill="#d94f4f"/><text x="754" y="196" fill="#d94f4f" class="lbl">圆弧圆心</text><text x="496" y="412" class="lbl">中轴起点内缩到圆弧圆心，缝落在折射早已衰减的深处，肉眼看不见。</text><path d="M24 470h42" style="stroke:#d94f4f;stroke-width:2.6;fill:none"/><text x="76" y="475" class="lbl">中轴：<tspan class="mono">|∇f| &lt; 1</tspan> 的位置，中心差分在这里平均了两个相反的单位梯度</text><text x="640" y="475" class="lbl">（cos45° ≈ 0.71）</text></svg>