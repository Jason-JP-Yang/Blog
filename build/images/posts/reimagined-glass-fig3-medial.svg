<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f3-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2f6fd0" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:15px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.edge,.n{fill:none;stroke:#2f6fd0;stroke-width:2.2}.n{stroke-width:2.4}</style></defs><path fill="#fbfcfd" d="M0 0h920v520H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">中轴处的法线不连续性</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">最近边界点发生切换的位置构成中轴；圆角的作用是把中轴端点从边界移入形状内部</text><rect width="420" height="340" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="106" class="cap">尖角正方形：中轴端点落在边界上</text><path fill="#d94f4f" fill-opacity=".1" fill-rule="evenodd" d="M139 155h190v190H139Zm22 22h146v146H161Z"/><path fill="#2f6fd0" fill-opacity=".05" d="M139 155h190v190H139z"/><path d="M139 155h190v190H139z" class="edge"/><path marker-end="url(#f3-blue)" d="M234 212v-32" class="n"/><path marker-end="url(#f3-blue)" d="M286 250h32" class="n"/><circle cx="329" cy="155" r="5" fill="#d94f4f"/><text x="378" y="128" class="lbl">中轴端点</text><text x="44" y="368" class="lbl">跨越中轴，精确法线旋转 90°</text><text x="44" y="392" class="lbl">端点处 <tspan class="mono">sd = 0</tspan>，折射偏移最大，接缝可见</text><rect width="420" height="340" x="476" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="496" y="106" class="cap">圆角矩形：中轴端点内缩一个圆角半径</text><path fill="#d94f4f" fill-opacity=".1" fill-rule="evenodd" d="M636 155h100a45 45 0 0145 45v100a45 45 0 01-45 45H636a45 45 0 01-45-45V200a45 45 0 0145-45m0 22h100a23 23 0 0123 23v100a23 23 0 01-23 23H636a23 23 0 01-23-23V200a23 23 0 0123-23"/><rect width="190" height="190" x="591" y="155" fill="#2f6fd0" fill-opacity=".05" rx="45"/><rect width="190" height="190" x="591" y="155" class="edge" rx="45"/><circle cx="636" cy="200" r="4" fill="#d94f4f"/><circle cx="736" cy="200" r="4" fill="#d94f4f"/><circle cx="636" cy="300" r="4" fill="#d94f4f"/><circle cx="736" cy="300" r="4" fill="#d94f4f"/><circle cx="686" cy="250" r="3.5" fill="#d94f4f"/><text x="784" y="156" class="lbl">圆弧圆心</text><text x="784" y="176" class="lbl">即中轴端点</text><text x="496" y="368" class="lbl">端点深度等于圆角半径，已脱离边界带</text><text x="496" y="392" class="lbl">该处折射已充分衰减，接缝不可见</text><path d="M24 450h38" style="stroke:#d94f4f;stroke-width:2.4;fill:none"/><text x="72" y="455" class="lbl">中轴</text><path fill="#d94f4f" fill-opacity=".18" d="M150 442h38v14h-38z"/><text x="198" y="455" class="lbl">边界带：折射偏移 <tspan class="mono">w/|sd|</tspan> 的高值区域</text><path marker-end="url(#f3-blue)" d="M510 450h38" class="n"/><text x="558" y="455" class="lbl">相邻扇区内的精确法线</text><text x="24" y="486" class="lbl">中心差分在中轴上平均了两个方向相反的单位梯度，正方形对角线上的结果为 <tspan class="mono">|∇f| = cos 45° ≈ 0.71</tspan></text></svg>