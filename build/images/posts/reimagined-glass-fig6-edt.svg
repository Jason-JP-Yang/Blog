<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f6-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#9aa2ad" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.par{fill:none;stroke:#c8d0da;stroke-width:1.5}.ax{stroke:#9aa2ad;stroke-width:1.4}</style></defs><path fill="#fbfcfd" d="M0 0h920v520H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">一维距离变换：抛物线族的下包络</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">Felzenszwalb–Huttenlocher 算法，复杂度 O(n)；二维情形按行、列各执行一次</text><rect width="872" height="42" x="24" y="76" fill="#f2f5f9" stroke="#dfe3e8" rx="10"/><text x="44" y="102" fill="#1f2328" class="mono" font-size="15">D(q) = min_v [ (q − v)² + f(v) ]</text><text x="330" y="102" class="lbl">每个样点 v 贡献一条顶点位于 (v, f(v)) 的开口向上抛物线，D 为该族抛物线的下包络</text><rect width="872" height="300" x="24" y="134" fill="#fff" stroke="#dfe3e8" rx="14"/><path marker-end="url(#f6-ink)" d="M60 390h824" class="ax"/><path marker-end="url(#f6-ink)" d="M70 400V152" class="ax"/><text x="34" y="150" fill="#6b7280" class="mono">D(q)</text><text x="872" y="412" fill="#6b7280" class="mono">q</text><path d="M80 270q145 290 290-120.8" class="par"/><path d="M256 150.9q164 448.2 328 0" class="par"/><path d="M482 149.8q168 470.4 336 0" class="par"/><path d="M80 270q117 234 234 11.7m0-.3Q423 474 532 270.5m0-1.5q143 281.3 286-119.2" style="fill:none;stroke:#2f6fd0;stroke-width:4;stroke-linecap:round"/><circle cx="200" cy="390" r="4.5" fill="#2f9e6b"/><circle cx="420" cy="375" r="4.5" fill="#2f9e6b"/><circle cx="650" cy="385" r="4.5" fill="#2f9e6b"/><text x="192" y="412" fill="#6b7280" class="mono">v₁</text><text x="412" y="412" fill="#6b7280" class="mono">v₂</text><text x="642" y="412" fill="#6b7280" class="mono">v₃</text><path d="M314 390v-98m218 98V282" style="stroke:#d94f4f;stroke-width:1.3;stroke-dasharray:5 4"/><text x="306" y="346" fill="#d94f4f" class="mono">z₁</text><text x="524" y="346" fill="#d94f4f" class="mono">z₂</text><text x="24" y="464" class="lbl">第一遍扫描维护包络：栈中保存当前生效的抛物线 <tspan class="mono">v[]</tspan> 及相邻两条的交点 <tspan class="mono">z[]</tspan>；</text><text x="24" y="488" class="lbl">第二遍扫描按 <tspan class="mono">z[]</tspan> 判定每个 q 落在哪一段，读出 <tspan class="mono">D(q)</tspan>。欧氏距离的平方可分离，故二维只需按行、列各做一遍。</text></svg>