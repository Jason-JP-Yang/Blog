<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f6-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f2328" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.par{fill:none;stroke:#c3cbd5;stroke-width:1.6}.ax{stroke:#9aa2ad;stroke-width:1.4}</style></defs><path fill="#fbfcfd" d="M0 0h920v480H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">精确欧氏距离变换：抛物线的下包络</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">Felzenszwalb–Huttenlocher，O(n)。每个样点贡献一条开口向上的抛物线，一维距离变换就是取它们的下包络</text><rect width="872" height="330" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><path marker-end="url(#f6-ink)" d="M60 380h820" class="ax"/><path marker-end="url(#f6-ink)" d="M60 392V110" class="ax"/><text x="838" y="400" class="lbl">q</text><text x="34" y="126" class="mono">D(q)</text><path d="M80 260Q235 570 390 79" class="par"/><path d="M235 80q185 570 370 0" class="par"/><path d="M462 80q188 589 376 0" class="par"/><path d="M80 260q117 234 234 11.7m0-.3Q423 464 532 260.5m0-1.5Q685 560 838 80" style="fill:none;stroke:#2f6fd0;stroke-width:4;stroke-linecap:round"/><circle cx="200" cy="380" r="4.5" fill="#2f9e6b"/><circle cx="420" cy="365" r="4.5" fill="#2f9e6b"/><circle cx="650" cy="375" r="4.5" fill="#2f9e6b"/><text x="182" y="402" class="lbl">v₁</text><text x="402" y="402" class="lbl">v₂</text><text x="632" y="402" class="lbl">v₃</text><path d="M314 380V200m218 180V200" style="stroke-width:1.4;stroke:#d94f4f;stroke-dasharray:5 4"/><text x="298" y="192" fill="#d94f4f" class="lbl">z₁</text><text x="518" y="192" fill="#d94f4f" class="lbl">z₂</text><text x="86" y="150" fill="#1f2328" class="mono">D(q) = min_v [ (q − v)² + f(v) ]</text><text x="86" y="172" class="lbl">每条抛物线的顶点在 (v, f(v))；扫一遍维护栈顶交点 z 就得到包络，</text><text x="86" y="192" class="lbl">再扫一遍读出每个 q 落在哪一段——两次线性扫描，逐行逐列各做一次即可得到二维精确 EDT。</text><text x="24" y="440" class="lbl">为什么必须「精确」：折射项要除以距离，chamfer / 8SSEDT 的近似误差会在轮廓上表现为肉眼可见的波纹。</text><text x="24" y="462" class="lbl">整个变换在 2× 分辨率上跑，然后把<tspan font-weight="700">距离场</tspan>做盒式降采样——距离场在边界附近可以正确平均，蒙版不行。</text></svg>