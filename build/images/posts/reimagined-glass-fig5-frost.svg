<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:16px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.tap{fill-opacity:.13;stroke:#2f6fd0;stroke-opacity:.45;stroke-width:1.2}.dot,.tap{fill:#2f6fd0}</style></defs><path fill="#fbfcfd" d="M0 0h920v500H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">磨砂：黄金角螺旋，而且用「相邻采样点间距」选 mip</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">直接读一层高 mip 的单个纹素，等于把那一层的纹素网格原样放大——这就是经典的磨砂马赛克</text><rect width="420" height="360" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="106" class="cap"><tspan class="mono" font-size="15">textureLod(uv, frost*maxLod)</tspan> · 出块</text><g style="stroke:#fff;stroke-width:2"><path fill="#7fa9e0" d="M124 146h55v55h-55z"/><path fill="#9dbfea" d="M179 146h55v55h-55z"/><path fill="#6f9ddb" d="M234 146h55v55h-55z"/><path fill="#b3cff0" d="M289 146h55v55h-55z"/><path fill="#a9c8ee" d="M124 201h55v55h-55z"/><path fill="#6b9ad9" d="M179 201h55v55h-55z"/><path fill="#c2daf4" d="M234 201h55v55h-55z"/><path fill="#88b0e3" d="M289 201h55v55h-55z"/><path fill="#6f9ddb" d="M124 256h55v55h-55z"/><path fill="#c9def6" d="M179 256h55v55h-55z"/><path fill="#93b8e7" d="M234 256h55v55h-55z"/><path fill="#5e8fd4" d="M289 256h55v55h-55z"/><path fill="#b8d3f2" d="M124 311h55v55h-55z"/><path fill="#82abe1" d="M179 311h55v55h-55z"/><path fill="#5b8ed3" d="M234 311h55v55h-55z"/><path fill="#a4c4ec" d="M289 311h55v55h-55z"/></g><text x="44" y="400" class="lbl">一次取样 = 一个大纹素，纹素边界就是可见的方块边界。</text><rect width="420" height="360" x="476" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="496" y="106" class="cap">10 个黄金角采样 · 核互相重叠</text><circle cx="686" cy="266" r="120" fill="none" stroke="#dfe3e8" stroke-dasharray="5 5"/><circle cx="686" cy="266" r="3" fill="#9aa2ad"/><circle cx="695.7" cy="241" r="34" class="tap"/><circle cx="644.3" cy="286.5" r="34" class="tap"/><circle cx="743.6" cy="282.8" r="34" class="tap"/><circle cx="649.2" cy="205.3" r="34" class="tap"/><circle cx="670.3" cy="345" r="34" class="tap"/><circle cx="757.7" cy="213.3" r="34" class="tap"/><circle cx="589.8" cy="255.5" r="34" class="tap"/><circle cx="754.7" cy="343.9" r="34" class="tap"/><circle cx="688.3" cy="155.3" r="34" class="tap"/><circle cx="605.2" cy="350.6" r="34" class="tap"/><circle cx="695.7" cy="241" r="3" class="dot"/><circle cx="644.3" cy="286.5" r="3" class="dot"/><circle cx="743.6" cy="282.8" r="3" class="dot"/><circle cx="649.2" cy="205.3" r="3" class="dot"/><circle cx="670.3" cy="345" r="3" class="dot"/><circle cx="757.7" cy="213.3" r="3" class="dot"/><circle cx="589.8" cy="255.5" r="3" class="dot"/><circle cx="754.7" cy="343.9" r="3" class="dot"/><circle cx="688.3" cy="155.3" r="3" class="dot"/><circle cx="605.2" cy="350.6" r="3" class="dot"/><text x="496" y="400" class="lbl">每个采样点的模糊半径 ≈ 采样点间距，圆盘互相咬合成一个连续核。</text><text x="24" y="462" fill="#1f2328" class="mono">a_i = i · 137.507°     r_i = R·√(i/N)     spacing = R/√N     lod = log2(texels(spacing))</text><text x="24" y="484" class="lbl">关键在最后一项：mip 由「间距」而不是「总半径」决定，否则圆盘之间会留下空隙。</text></svg>