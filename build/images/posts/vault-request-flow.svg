<svg xmlns="http://www.w3.org/2000/svg" aria-label="How an encrypted post request is served" viewBox="0 0 780 440" xmlns:xlink="http://www.w3.org/1999/xlink"><title>How an encrypted post request is served</title><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#71717a" d="m0 0 10 5-10 5z"/></marker><marker id="ah" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a31f34" d="m0 0 10 5-10 5z"/></marker><style>.box{fill:#fafafa;stroke:#d4d4d8;stroke-width:1.2}.lane{fill:#a1a1aa;font:600 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em}.t{fill:#27272a;font:600 13px ui-sans-serif,system-ui,sans-serif}.s{fill:#71717a;font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace}.c{fill:#a31f34;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace}.hot,.line{fill:none}.line{stroke:#71717a;stroke-width:1.3}.hot{stroke:#a31f34;stroke-width:1.6}@media (prefers-color-scheme:dark){.box{fill:#232327;stroke:#3f3f46}.lane{fill:#71717a}.t{fill:#e4e4e7}.s{fill:#a1a1aa}.c{fill:#e26d7e}.line{stroke:#a1a1aa}.hot{stroke:#e26d7e}}</style></defs><rect width="780" height="440" rx="12" style="fill:#fff"/><path d="M258 34v376M536 34v376" style="stroke:#e4e4e7;stroke-width:1;stroke-dasharray:4 5"/><text x="24" y="26" class="lane">BROWSER</text><text x="278" y="26" class="lane">CLOUDFLARE WORKER</text><text x="556" y="26" class="lane">CDN</text><rect width="206" height="52" x="24" y="44" class="box" rx="10"/><text x="40" y="66" class="t">GitHub session</text><text x="40" y="84" class="s">giscus OAuth → HMAC token</text><rect width="230" height="52" x="278" y="44" class="box" rx="10"/><text x="294" y="66" class="t">POST /api/vault/keys</text><text x="294" y="84" class="s">verify → 1 row → unwrap</text><rect width="230" height="70" x="278" y="140" class="box" rx="10"/><text x="294" y="162" class="t">D1</text><text x="294" y="180" class="s">vault_posts → wrapped key</text><text x="294" y="197" class="s">moderation.vault → grants</text><rect width="206" height="92" x="24" y="196" class="box" rx="10"/><text x="40" y="218" class="t">postKey — in memory</text><text x="40" y="237" class="s">non-extractable CryptoKey</text><text x="40" y="254" class="s">never written to storage</text><text x="40" y="273" class="c">dies with the tab</text><rect width="200" height="52" x="556" y="140" class="box" rx="10"/><text x="572" y="162" class="t">/v/&lt;slug&gt;/b.bin</text><text x="572" y="180" class="s">iv ‖ ciphertext ‖ tag</text><rect width="200" height="52" x="556" y="208" class="box" rx="10"/><text x="572" y="230" class="t">/v/a/&lt;hash&gt;.bin</text><text x="572" y="248" class="s">sealed AVIF image</text><rect width="200" height="52" x="556" y="276" class="box" rx="10"/><text x="572" y="298" class="t">/v/g/&lt;variant&gt;.bin</text><text x="572" y="316" class="s">pre-solved bento grid</text><rect width="732" height="58" x="24" y="352" class="box" rx="10"/><text x="40" y="374" class="t">Rendered article</text><text x="40" y="393" class="s">AES-256-GCM in the browser · images become blob: URLs · no plaintext ever reaches disk</text><path marker-end="url(#ah)" d="M230 70h42" class="hot"/><text x="150" y="112" class="c">Bearer session</text><path marker-end="url(#a)" d="M393 96v40" class="line"/><path marker-end="url(#ah)" d="M278 88q-128 0-145 104" class="hot"/><text x="140" y="180" class="c">postKey</text><path marker-end="url(#ah)" d="M230 214h320" class="hot"/><path marker-end="url(#ah)" d="M230 240q170 0 320-4" class="hot"/><path marker-end="url(#ah)" d="M230 264q170 38 320 38" class="hot"/><text x="322" y="206" class="s">fetch — no Worker, no D1</text><path marker-end="url(#a)" d="M127 288v60" class="line"/><path marker-end="url(#a)" d="M656 328v20" class="line"/></svg>