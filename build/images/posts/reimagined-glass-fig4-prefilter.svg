<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f4-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1f2328" d="m0 0 10 5-10 5z"/></marker><marker id="f4-red" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#d94f4f" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:16px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.ax{stroke:#9aa2ad;stroke-width:1.4}.pix{stroke:#d94f4f;stroke-width:1.6;stroke-dasharray:4 3}</style></defs><path fill="#fbfcfd" d="M0 0h920v500H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">折射偏移的发散与 mip 预滤波</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">偏移量随 <tspan class="mono">1/|sd|</tspan> 发散；靠近边界时，相邻像素的采样位置差值可达背景尺寸的显著比例</text><rect width="500" height="330" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="106" class="cap">偏移量随边界深度的变化</text><path d="M120 140h360m-360 60h360m-360 60h360m-360 60h360" style="stroke:#eef1f4;stroke-width:1"/><path marker-end="url(#f4-ink)" d="M120 380h372" class="ax"/><path marker-end="url(#f4-ink)" d="M120 392V122" class="ax"/><text x="440" y="398" class="lbl">深度 −sd →</text><text x="70" y="130" class="lbl">|offset|</text><text x="112" y="398" class="lbl">边缘</text><path d="m140.4 115.6 6.8 70.4 6.8 42 17 56.3 17 28.2 34 28.1 34 14.1 34 8.4 68 9.7 102 7.2" style="fill:none;stroke:#2f6fd0;stroke-width:3"/><path d="M140.4 380V115.6m6.8 264.4V186m-6.8-70.4h6.8" class="pix"/><path stroke-dasharray="0" marker-end="url(#f4-red)" marker-start="url(#f4-red)" d="M152 115.6V186" class="pix"/><text x="162" y="148" fill="#d94f4f" class="lbl">相邻一个像素，</text><text x="162" y="166" fill="#d94f4f" class="lbl">采样位置差值已达背景尺寸的显著比例</text><text x="44" y="424" class="lbl">对梯度无界的函数作点采样必然混叠为彩色噪点，提高超采样倍数无法使其收敛。</text><rect width="340" height="330" x="556" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="576" y="106" class="cap">解析求 LOD</text><path fill="#eaf1fb" stroke="#9fbdea" d="M576 126h180v52H576z"/><text x="770" y="157" class="lbl">LOD 0</text><path fill="#dfeafa" stroke="#9fbdea" d="M576 186h140v42H576z"/><text x="770" y="212" class="lbl">LOD 1</text><path fill="#cfe0f7" stroke="#2f6fd0" stroke-width="2.4" d="M576 236h104v34H576z"/><text x="770" y="257" fill="#2f6fd0" class="lbl" font-weight="700">LOD 2 ←</text><path fill="#bfd5f3" stroke="#9fbdea" d="M576 278h72v26h-72z"/><text x="770" y="296" class="lbl">LOD 3</text><path fill="#aecaf0" stroke="#9fbdea" d="M576 312h48v20h-48z"/><text x="770" y="327" class="lbl">LOD 4</text><text x="576" y="362" fill="#1f2328" class="mono">footprint = amp·re·px / sd²</text><text x="576" y="384" fill="#1f2328" class="mono">lod = log2(texels(footprint))</text><text x="24" y="452" class="lbl">硬件纹理单元本可自动完成选层，但在动态分支与动态循环内，<tspan class="mono">texture()</tspan> 的隐式导数属未定义行为，</text><text x="24" y="474" class="lbl">ANGLE / D3D 会直接拒绝编译，因此改用 <tspan class="mono">textureLod()</tspan> 并由解析式给出层级。</text></svg>