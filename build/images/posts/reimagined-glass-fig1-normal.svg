<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="f1-blue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2f6fd0" d="m0 0 10 5-10 5z"/></marker><marker id="f1-red" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#d94f4f" d="m0 0 10 5-10 5z"/></marker><style>text{font-family:&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.cap{font-size:16px;font-weight:600;fill:#1f2328}.lbl,.mono{font-size:13px}.lbl{fill:#6b7280}.mono{font-family:&quot;Cascadia Code&quot;,Consolas,ui-monospace,monospace}.n,.r{stroke:#2f6fd0;stroke-width:2.6;fill:none}.r{stroke:#d94f4f;stroke-width:2.2;stroke-dasharray:6 4}.shape{fill:#eaf1fb;stroke:#2f6fd0;stroke-width:2}.arc{stroke:#d99527;stroke-width:1.6;fill:none}</style></defs><path fill="#fbfcfd" d="M0 0h920v520H0z"/><text x="24" y="34" style="font-size:21px;font-weight:700;fill:#1f2328">径向方向与表面法线的差异</text><text x="24" y="58" style="font-size:14px;fill:#6b7280">「由形状中心指向外」与「表面法线」是两个不同的量，二者仅在圆上重合</text><rect width="420" height="392" x="24" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="44" y="106" class="cap">圆：二者处处重合</text><circle cx="234" cy="288" r="120" class="shape"/><circle cx="234" cy="288" r="3.5" fill="#1f2328"/><path marker-end="url(#f1-blue)" d="M193 175.2 177.6 133" class="n"/><text x="44" y="440" class="lbl">每一点上 <tspan class="mono">normalize(st)</tspan> 与 <tspan class="mono">∇f</tspan> 严格同向</text><rect width="420" height="392" x="476" y="76" fill="#fff" stroke="#dfe3e8" rx="14"/><text x="496" y="106" class="cap">正方形：夹角最大可达 45°</text><path d="M596 188h200v200H596z" class="shape"/><circle cx="696" cy="288" r="3.5" fill="#1f2328"/><path d="M696 288h100" style="stroke:#b9c0c9;stroke-width:1.2;stroke-dasharray:3 4;fill:none"/><path marker-end="url(#f1-blue)" d="M796 288h50" class="n"/><path marker-end="url(#f1-red)" d="M796 283h50" class="r"/><text x="806" y="312" fill="#2f9e6b" class="lbl">0°</text><path marker-end="url(#f1-blue)" d="M796 238h50" class="n"/><path d="M826 238a30 30 0 00-3.2-13.4" class="arc"/><text x="828" y="212" fill="#d99527" class="lbl">≈27°</text><path marker-end="url(#f1-blue)" d="M796 188h50" class="n"/><path d="M826 188a30 30 0 00-8.8-21.2" class="arc"/><text x="826" y="152" fill="#d99527" class="lbl">45°</text><text x="496" y="424" class="lbl">越接近角点，径向方向与表面法线的夹角越大，</text><text x="496" y="444" class="lbl">折射方向随之产生系统性偏差。</text><path marker-end="url(#f1-red)" d="M24 496h42" class="r"/><text x="76" y="501" class="lbl">径向方向 <tspan class="mono">normalize(st)</tspan>：参考实现所用</text><path marker-end="url(#f1-blue)" d="M430 496h42" class="n"/><text x="482" y="501" class="lbl">表面法线 <tspan class="mono">∇f / |∇f|</tspan>：本实现所用</text></svg>